[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lemma-replay"
version = "0.1.0"
description = "Deterministic Replay Engine & CI Regression Guard for Lemma Agent Traces"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "click>=8.0.0"
]

[project.scripts]
lemma-replay = "lemma_replay.cli:main"
trace2test = "lemma_replay.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0"
]
